name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest py${{ matrix.python }} / Django ${{ matrix.django }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
        django: ["4.2", "5.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Poetry
        run: pipx install poetry==2.1.4
      - name: Install dependencies (locked)
        run: poetry install --no-interaction
      - name: Pin Django to the matrix version
        run: poetry run pip install "django~=${{ matrix.django }}.0"
      - name: Lint (ruff + mypy + bandit)
        run: |
          poetry run ruff check django_admin_react tests
          poetry run ruff format --check django_admin_react tests
          poetry run mypy django_admin_react
          poetry run bandit -r django_admin_react -c pyproject.toml -q
      - name: Tests (pytest)
        run: poetry run pytest

  frontend:
    name: Frontend (typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc --noEmit, every package)
        run: pnpm -r typecheck
      - name: Lint (eslint + stylelint + dark-mode coverage)
        run: pnpm lint
      - name: Unit tests (vitest)
        run: pnpm test
      - name: Build (Vite bundle, every package)
        run: pnpm -r build
      - name: Verify Django static bundle output
        working-directory: .
        run: |
          test -s django_admin_react/static/admin_react/.vite/manifest.json
          test -d django_admin_react/static/admin_react/assets
          test -n "$(find django_admin_react/static/admin_react/assets -type f -name '*.js' -print -quit)"

  package:
    name: Package (wheel contains SPA)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9
      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry==2.1.4
      - name: Build distributable
        run: bash scripts/build.sh
      - name: Verify wheel embeds Vite manifest and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, f'expected one wheel, found {wheels}'
          with ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
          manifest = 'django_admin_react/static/admin_react/.vite/manifest.json'
          assert manifest in names, f'{manifest} missing from wheel'
          js_assets = [n for n in names if n.startswith('django_admin_react/static/admin_react/assets/') and n.endswith('.js')]
          assert js_assets, 'no compiled SPA JavaScript assets in wheel'
          print(f'verified {wheels[0]}: manifest + {len(js_assets)} JS asset(s)')
          PY
